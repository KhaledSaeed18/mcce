<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>MCCE: The whole program, indexed.</title>
    <link href="showcase.css" rel="stylesheet">
  </head>
  <body>
    <main aria-label="MCCE README header" class="board">
      <header class="intro">
        <p class="brand">
          <img
            alt=""
            height="40"
            src="../../../src/assets/brand/mark.svg"
            width="40"
          >MCCE
        </p>
        <h1>The whole program, <span class="underline">indexed.</span></h1>
        <p class="lede">
          Course files, past exams, the prerequisite map, GPA planning, and a
          PDF editor for the LIU M.S. in Computer and Communication Engineering.
        </p>
        <p class="address">mcce.khaledsaeed.tech</p>
      </header>
      <div class="tiles">
        <figure class="tile roadmap">
          <figcaption><i></i>Roadmap</figcaption>
          <div class="frame">
            <img
              alt="The prerequisite roadmap with EENG527 traced to every course it unlocks."
              height="1472"
              src="roadmap-trace.webp"
              width="3300"
            >
          </div>
        </figure>
        <figure class="tile search">
          <figcaption><i></i>Search</figcaption>
          <div class="frame">
            <img
              alt="Search for final sample lists exam papers from across the program."
              height="1011"
              src="search.webp"
              width="1152"
            >
          </div>
        </figure>
        <figure class="tile editor">
          <figcaption><i></i>PDF editor</figcaption>
          <div class="frame">
            <img
              alt="A DSP lecture open in the PDF editor with highlights and a circled formula."
              height="1800"
              src="editor.webp"
              width="2280"
            >
          </div>
        </figure>
        <figure class="tile gpa">
          <figcaption><i></i>GPA calculator</figcaption>
          <div class="frame">
            <img
              alt="Sample grades yield a cumulative GPA of 3.62, with 12 of 52 credits graded."
              height="1842"
              src="gpa.webp"
              width="3372"
            >
          </div>
        </figure>
      </div>
    </main>
  </body>
</html>
