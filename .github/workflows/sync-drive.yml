name: Sync Drive index

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: sync-drive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit_push.outputs.committed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Crawl Drive and regenerate the index
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: pnpm run sync:drive

      - name: Commit and push the regenerated index
        id: commit_push
        run: |
          git config user.name "mcce-drive-sync[bot]"
          git config user.email "mcce-drive-sync[bot]@users.noreply.github.com"
          git add src/data/drive-index.json public/sitemap.xml public/feed.xml
          # Every artifact carries the run's own generatedAt, which the site
          # shows as "Last sync", so a run with no new material still has a
          # timestamp worth publishing. This only guards an empty commit.
          if git diff --cached --quiet; then
            echo "Nothing staged, skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): sync drive index" --no-verify
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: sync
    if: needs.sync.outputs.committed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
