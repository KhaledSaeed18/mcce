name: Resources index

on:
  pull_request:
    branches: [main]
    paths:
      - "src/config/resources/**"
      - "src/data/resources-index.json"
      - "public/resources/icons/**"
      - "scripts/build-resources/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Index is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Rebuild the index from the catalog and compare
        run: pnpm run build:resources -- --skip-links --skip-icons --check
