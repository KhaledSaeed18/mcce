pre-commit:
  jobs:
    - run: pnpm dlx ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      exclude:
        - "src/data/drive-index.json"
        - "src/data/resources-index.json"
        - "public/resources/icons/**"
      stage_fixed: true
